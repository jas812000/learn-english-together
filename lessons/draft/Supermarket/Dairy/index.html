<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supermarket — Dairy</title>
  <link rel="stylesheet" href="../../../../assets/site.css" />
</head>
<body>
  <header class="header">
    <div class="container">
      <!-- Thai -->
      <h1>ผลิตภัณฑ์นม</h1>
      <p class="muted">ฝึกคำศัพท์เกี่ยวกับนมและชีส</p>
      <!-- English -->
      <h1>Dairy</h1>
      <p class="muted">Practice milk, cheese, and more</p>
      <p class="muted"><a href="../../../../index.html">← Supermarket</a> • <a href="../../../../index.html">Home</a></p>
    </div>
  </header>

  <main class="container"><div class="grid cards" id="cards"></div></main>
  <footer class="footer"><div class="container">© <span id="y"></span> English Practice Zone</div></footer>

  <script>
    const ITEMS = [
      { word: "Milk", img: "milk.png", audio: "milk.mp3" },
      { word: "Cheese", img: "cheese.png", audio: "cheese.mp3" },
      { word: "Yogurt", img: "yogurt.png", audio: "yogurt.mp3" },
      { word: "Butter", img: "butter.png", audio: "butter.mp3" },
      { word: "Eggs", img: "eggs.png", audio: "eggs.mp3" }
    ];
    function addCard({ word, img, audio }) {
      const div = document.createElement("div"); div.className = "card";
      div.innerHTML = `<figure><img src="img/${img}" alt="${word}"></figure>
        <div class="label"><span class="word">${word}</span><button class="speak" data-audio="${word}">🔊</button></div>
        <audio id="audio-${word}" preload="auto"><source src="audio/${audio}" type="audio/mpeg"></audio>`;
      document.getElementById("cards").appendChild(div);
    }
    ITEMS.forEach(addCard);
  </script>
  <script src="../../../../assets/site.js"></script>
</body>
</html>
