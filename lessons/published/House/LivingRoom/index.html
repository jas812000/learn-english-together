<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>English Practice Zone — Living Room</title>
  <link rel="stylesheet" href="../../../../assets/site.css" />
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>ห้องนั่งเล่น / Living Room
        <button class="speak" data-audio="living_room">🔊</button>
      </h1>
      <audio id="audio-living_room" preload="auto">
        <source src="audio/living_room.mp3" type="audio/mpeg">
      </audio>
      <p class="muted"><a href="../../../../index.html">← House</a> • <a href="../../../../index.html">Home</a></p>
    </div>
  </header>

  <main class="container"><div class="grid cards" id="cards"></div></main>
  <footer class="footer"><div class="container">© <span id="y"></span> English Practice Zone</div></footer>

  <script>
    // List of living room items with matching image/audio filenames
    const ITEMS = [
      { word: "Sofa", img: "sofa.png", audio: "sofa.mp3" },
      { word: "Love Seat", img: "love_seat.png", audio: "love_seat.mp3" },
      { word: "Chair", img: "chair.png", audio: "chair.mp3" },
      { word: "Television", img: "television.png", audio: "television.mp3" },
      { word: "Lamp", img: "lamp.png", audio: "lamp.mp3" },
      { word: "Table", img: "table.png", audio: "table.mp3" },
      { word: "Radio", img: "radio.png", audio: "radio.mp3" }
    ];

    function addCard({ word, img, audio }) {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <figure><img src="image/${img}" alt="${word}"></figure>
        <div class="label">
          <span class="word">${word}</span>
          <button class="speak" data-audio="${word}">🔊</button>
        </div>
        <audio id="audio-${word}" preload="auto">
          <source src="audio/${audio}" type="audio/mpeg">
        </audio>
      `;
      document.getElementById("cards").appendChild(div);
    }

    ITEMS.forEach(addCard);
  </script>
  <script src="../../../../assets/site.js"></script>
</body>
</html>
