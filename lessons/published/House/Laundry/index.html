<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>English Practice Zone — Laundry</title>
  <link rel="stylesheet" href="../../../../assets/site.css" />
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>ห้องซักรีด / Laundry
        <button class="speak" data-audio="laundry">🔊</button>
      </h1>
      <audio id="audio-laundry" preload="auto">
        <source src="audio/laundry.mp3" type="audio/mpeg">
      </audio>
      <p class="muted"><a href="../../../../index.html">← House</a> • <a href="../../../../index.html">Home</a></p>
    </div>
  </header>

  <main class="container"><div class="grid cards" id="cards"></div></main>
  <footer class="footer"><div class="container">© <span id="y"></span> English Practice Zone</div></footer>

  <script>
    // List of laundry items with matching image/audio filenames
    const ITEMS = [
      { word: "Washing Machine", img: "washing_machine.png", audio: "washing_machine.mp3" },
      { word: "Dryer", img: "dryer.png", audio: "dryer.mp3" },
      { word: "Detergent", img: "detergent.png", audio: "detergent.mp3" },
      { word: "Laundry Basket", img: "laundry_basket.png", audio: "laundry_basket.mp3" },
      { word: "Iron", img: "iron.png", audio: "iron.mp3" },
      { word: "Ironing Board", img: "ironing_board.png", audio: "ironing_board.mp3" }
    ];

    function addCard({ word, img, audio }) {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <figure><img src="image/${img}" alt="${word}"></figure>
        <div class="label">
          <span class="word">${word}</span>
          <button class="speak" data-audio="${word}">🔊</button>
        </div>
        <audio id="audio-${word}" preload="auto">
          <source src="audio/${audio}" type="audio/mpeg">
        </audio>
      `;
      document.getElementById("cards").appendChild(div);
    }

    ITEMS.forEach(addCard);
  </script>
  <script src="../../../../assets/site.js"></script>
</body>
</html>
